{% extends "base.html" %}
{% block title %}Q&A Bank{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Q&amp;A Bank</h2>

<form method="post" action="/admin/profile-answers/add" class="card p-6 max-w-2xl space-y-3 mb-6">
    <input name="question" placeholder="Question (e.g. Are you legally authorized to work?)" required
           class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
    <textarea name="answer" placeholder="Answer" required rows="2"
              class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white"></textarea>
    <div class="flex gap-3 items-center">
        <select name="category" class="px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
            <option value="B">B — auto-answer</option>
            <option value="A">A — escalate</option>
        </select>
        <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded font-semibold text-white">Add answer</button>
    </div>
</form>

<div class="card p-6 max-w-2xl space-y-2">
    {% for a in answers %}
    <div class="flex items-start justify-between gap-4 border-b border-slate-800 py-2">
        <div class="min-w-0">
            <p class="text-sm text-white font-medium truncate">{{ a.question_text }}</p>
            <p class="text-xs text-slate-400 truncate">{{ a.answer_text }}</p>
            <p class="text-xs text-slate-600">category {{ a.category }} · used {{ a.times_used }}×</p>
        </div>
        <form method="post" action="/admin/profile-answers/{{ a.id }}/delete">
            <button class="text-xs text-rose-400 hover:text-rose-300">Delete</button>
        </form>
    </div>
    {% else %}
    <p class="text-sm text-slate-500">No stored answers yet.</p>
    {% endfor %}
</div>
{% endblock %}
