{% extends "base.html" %}
{% block title %}Regions{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Target Regions</h2>
<p class="text-sm text-slate-400 mb-4">Valid values: <span class="mono">EU, UK, Nigeria, Turkiye</span> (one per line). Regional adapters are only searched for their own region.</p>
<form method="post" action="/admin/regions" class="card p-6 max-w-2xl space-y-4">
    <textarea name="regions" rows="6" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white mono">
{%- for r in regions %}{{ r }}
{% endfor -%}
</textarea>
    <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded font-semibold text-white">Save</button>
</form>
{% endblock %}
