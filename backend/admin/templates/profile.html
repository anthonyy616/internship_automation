{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Profile &amp; Materials</h2>
<form method="post" action="/admin/profile" class="card p-6 max-w-2xl space-y-4">
    <div class="grid md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Full name</label>
            <input name="name" value="{{ profile.name }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Email</label>
            <input name="email" value="{{ profile.email }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">University</label>
            <input name="university" value="{{ profile.university }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Major</label>
            <input name="major" value="{{ profile.major }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
        </div>
    </div>
    <div>
        <label class="block text-sm text-slate-400 mb-1">Portfolio URL</label>
        <input name="portfolio_url" value="{{ profile.portfolio_url }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
    </div>
    <div>
        <label class="block text-sm text-slate-400 mb-1">Skills (comma separated)</label>
        <input name="skills" value="{{ profile.skills | join(', ') }}" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white">
    </div>
    <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded font-semibold text-white">Save</button>
</form>
{% endblock %}
