{% extends "base.html" %}
{% block title %}Keywords{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Search Keywords</h2>
<form method="post" action="/admin/keywords" class="card p-6 max-w-2xl space-y-4">
    <label class="block text-sm text-slate-400">One keyword per line</label>
    <textarea name="keywords" rows="12" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white mono">
{%- for k in keywords %}{{ k }}
{% endfor -%}
</textarea>
    <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded font-semibold text-white">Save</button>
</form>
{% endblock %}
