{% extends "base.html" %}
{% block title %}Blocklist{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Company &amp; Domain Blocklist</h2>
<form method="post" action="/admin/blocklist" class="card p-6 max-w-2xl space-y-4">
    <div>
        <label class="block text-sm text-slate-400 mb-1">Blocked companies (one per line)</label>
        <textarea name="companies" rows="6" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white mono">
{%- for c in blocklist.companies %}{{ c }}
{% endfor -%}
</textarea>
    </div>
    <div>
        <label class="block text-sm text-slate-400 mb-1">Blocked email domains (one per line, e.g. evilcorp.com)</label>
        <textarea name="domains" rows="4" class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white mono">
{%- for d in blocklist.domains %}{{ d }}
{% endfor -%}
</textarea>
    </div>
    <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded font-semibold text-white">Save</button>
</form>
{% endblock %}
