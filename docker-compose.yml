services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  worker:
    build: .
    command: python -m arq backend.workers.settings.WorkerSettings
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped